name: Bug 报告
description: 报告 AI Studio 的错误行为或异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请先搜索 [已有 Issue](https://github.com/r4fpsdmyr7-blip/AI-Studio-Docs/issues)
        确认是否已被记录。填写越完整，定位越快。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 出现了什么问题？
      placeholder: 执行 `./ai-studio.sh start open-webui` 后浏览器没有自动打开，且端口未监听。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出可复现的完整命令序列
      placeholder: |
        1. `./ai-studio.sh env install`
        2. `./ai-studio.sh install open-webui`
        3. `./ai-studio.sh start open-webui`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 服务应在 3000 端口启动，并自动打开浏览器。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请粘贴完整输出。日志位于 logs/<组件名>.log
      placeholder: |
        [INFO] Starting open-webui in background...
        [ERROR] open-webui failed to start. PID 1234 exited immediately.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响的组件
      options:
        - 无（主入口 / 通用问题）
        - open-webui
        - mlx
        - model
        - sillytavern
        - continue-dev
        - fazm
        - browser-use
        - comfyui
        - mlx-video
        - qwen3
        - 环境安装（env 命令）
        - 其他
    validations:
      required: true

  - type: input
    id: ai-studio-version
    attributes:
      label: AI Studio 版本
      description: 运行 `./ai-studio.sh version` 获取
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      description: 运行 `sw_vers -productVersion` 获取
      placeholder: "26.6.2"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: 芯片架构
      options:
        - Apple Silicon (arm64 / M 系列)
        - Intel (x86_64)
    validations:
      required: true

  - type: input
    id: bash-version
    attributes:
      label: Bash 版本
      description: 运行 `bash --version | head -1` 获取
      placeholder: "GNU bash, version 3.2.57(1)-release"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他可能有用的上下文（是否使用代理、是否修改过配置文件等）
    validations:
      required: false
