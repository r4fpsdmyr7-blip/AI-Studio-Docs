name: 功能建议
description: 提出新功能、新组件或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明你想解决的问题，而不只是想要的实现方式——
        这有助于我们找到更好的方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么困难？当前工作流哪里不顺？
      placeholder: 每次换机器都要重新手工配置 ComfyUI 环境，非常耗时。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      placeholder: 希望 `ai-studio install comfyui` 能一键完成 ComfyUI 的完整部署。
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 新增组件
        - 增强已有组件
        - 新增命令 / 参数
        - 文档改进
        - 性能 / 稳定性
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你尝试过或考虑过的其他做法
    validations:
      required: false

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: 是否愿意参与实现
      options:
        - "是，我愿意提交 PR"
        - "是，但需要指导（请标记 good first issue）"
        - "否，仅提出建议"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考链接、截图、其他项目的做法等
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，确认这不是重复建议
          required: true
        - label: 我已阅读 CONTRIBUTING.md
          required: false
